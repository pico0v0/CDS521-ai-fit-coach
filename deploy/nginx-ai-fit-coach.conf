server {
    listen 6694 ssl http2;
    listen [::]:6694 ssl http2;
    server_name lnstudy.duckdns.org 113.125.2.92;

    ssl_certificate     /etc/letsencrypt/live/lnstudy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lnstudy.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FIT_SSL:5m;
    ssl_session_timeout 1h;

    error_page 497 https://lnstudy.duckdns.org:6694$request_uri;

    client_max_body_size 50m;

    access_log /var/log/nginx/ai-fit-coach.access.log;
    error_log  /var/log/nginx/ai-fit-coach.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location /plan {
        proxy_pass http://127.0.0.1:6692/plan;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout                 86400;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://lnstudy.duckdns.org:6694 http://113.125.2.92:6694" always;
    }
}
