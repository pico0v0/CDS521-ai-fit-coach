<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动作姿态与运动学对照实验室</title>
<style>
:root{color-scheme:dark;--bg:#09131b;--card:#10232f;--edge:#254551;--mint:#91ead4;--text:#eaf6f5;--mute:#9ab2b8;--amber:#ffd18c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -10%,#173a43 0%,var(--bg) 58%);color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:24px}.tag{font-size:11px;letter-spacing:.22em;font-weight:800;color:var(--mint)}h1{font-size:clamp(25px,3vw,39px);margin:6px 0 8px}.desc{font-size:13px;color:var(--mute);max-width:900px;line-height:1.8;margin:0 0 20px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#10212bc7;border:1px solid var(--edge);border-radius:14px;padding:14px;margin-bottom:16px}
select,button,input{accent-color:#9ae7c3}select,button{color:var(--text);background:#1a3440;border:1px solid #40616a;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}button.primary{background:#a6f4ca;color:#0c3229;border-color:transparent}input[type=range]{flex:1;min-width:155px}#clock{min-width:86px;text-align:right;font:700 13px ui-monospace,monospace;color:#e2f7ee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{border:1px solid #33515d;border-radius:16px;overflow:hidden;background:linear-gradient(155deg,#102835,#06131c);box-shadow:0 14px 46px #0004}.paneHead{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #29454c}.paneHead strong{font-size:15px}.paneHead span{font-size:11px;color:var(--mute)}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px;gap:9px}.metric{border:1px solid #243f49;background:#09192278;border-radius:9px;padding:10px}.key{font-size:10px;color:var(--mute)}.value{font-size:17px;font-weight:800;margin-top:4px;color:#a9efd5;font-variant-numeric:tabular-nums}.err .value{color:var(--amber)}.foot{margin:20px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:#adc1c3}.foot b{color:var(--mint)}.note{margin-top:12px;font-size:12px;color:#829fa6;line-height:1.8}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="tag">AI FIT COACH · SKELETON MOTION LAB</div>
<h1 id="pageTitle">动作姿态与运动学对照</h1>
<p class="desc" id="pageDesc">960×540 像素坐标约束 · 全骨段长度固定 · 关节角与分析器严格统一 · 每周期 4700ms。左侧是标准正确动作，右侧选择典型错误对照。</p>
<div class="toolbar">
  <label for="exerciseSelect">训练动作</label>
  <select id="exerciseSelect">
    <option value="jumping_jack" selected>开合跳 (JUMPING JACK)</option>
    <option value="lunge">弓步 (LUNGE)</option>
    <option value="pushup">俯卧撑 (PUSH-UP)</option>
    <option value="squat">深蹲 (SQUAT)</option>
    <option value="curl">弯举 (CURL)</option>
  </select>
  <label for="variant">错误模式</label>
  <select id="variant"></select>
  <label for="difficulty">难度</label>
  <select id="difficulty"><option value="standard">标准</option><option value="beginner">初学</option><option value="advanced">进阶</option></select>
  <button id="play" class="primary">⏸ 暂停</button><button id="reset">↺ 重播</button>
  <input type="range" id="scrub" min="0" max="4700" step="10" value="0" aria-label="拖动时间轴">
  <span id="clock">0.00 / 4.70s</span>
</div>
<div class="grid">
  <section class="pane"><div class="paneHead"><strong>✓ 正确示范</strong><span id="goodSub">标准动作 · 轨迹平稳</span></div><canvas id="good" width="960" height="540"></canvas><div class="metrics"><div class="metric"><div class="key">关键角 / 指标</div><div class="value" id="goodArm">—</div></div><div class="metric"><div class="key">动作完成度</div><div class="value" id="goodLeg">—</div></div><div class="metric"><div class="key">辅助位移</div><div class="value" id="goodLift">—</div></div></div></section>
  <section class="pane err"><div class="paneHead"><strong id="faultName">! 姿态错误</strong><span>同一时间轴 · 可逐帧对照</span></div><canvas id="fault" width="960" height="540"></canvas><div class="metrics"><div class="metric"><div class="key">关键角 / 指标</div><div class="value" id="badArm">—</div></div><div class="metric"><div class="key">动作完成度</div><div class="value" id="badLeg">—</div></div><div class="metric"><div class="key">AI 实时告警</div><div class="value" id="alarm">—</div></div></div></section>
</div>
<div class="foot" id="footInfo"><b>参数校验</b>960×540 刚体不变性校验通过。<b>判定</b>状态机与姿态核验模块无缝对接。</div>
</div>
<script type="module">
import {simulatePose,simulatedAngle} from './src/simulator.js';
import {drawPose} from './src/draw.js';
import {checkPostureFault,extractJointAngle,getLegSpreadRatio,angleDegrees,toPixelPoint} from './src/exercise.js';
const $=id=>document.getElementById(id);
const FAULTS={
  jumping_jack:['手腿脱节','双臂不对称','腿未展开'],
  lunge:['前膝超脚尖 / 躯干前扑','幅度不足 (浅弓步)'],
  pushup:['腰腹塌陷 / 撅臀折角','幅度不足 (半程推起)'],
  squat:['躯干过度前倾','深度不足 (浅蹲)'],
  curl:['大臂前后借力','幅度不足 (半程弯举)']
};
let clockMs=0,playing=true,last=performance.now();

function updateVariants(){
  const ex=$('exerciseSelect').value;
  const list=FAULTS[ex]||FAULTS.jumping_jack;
  $('variant').innerHTML=list.map((name,i)=>`<option value="${i}">错误 0${i+1} · ${name}</option>`).join('');
  $('pageTitle').textContent=`${ex==='lunge'?'弓步':(ex==='pushup'?'俯卧撑':(ex==='squat'?'深蹲':(ex==='curl'?'弯举':'开合跳')))} · 正确 / 错误姿势运动学对照`;
}

function render(){
  const ex=$('exerciseSelect').value;
  const ix=Number($('variant').value)||0;
  const diff=$('difficulty').value;
  const normal=simulatePose(clockMs,ex,{mode:'standard',difficulty:diff});
  const faulty=simulatePose(clockMs,ex,{mode:'fault',faultIndex:ix,difficulty:diff});

  const normAngleObj=extractJointAngle(normal,ex);
  const faultAngleObj=extractJointAngle(faulty,ex);
  const normAng=normAngleObj?.angle??simulatedAngle(clockMs,ex,{mode:'standard',difficulty:diff});
  const faultAng=faultAngleObj?.angle??simulatedAngle(clockMs,ex,{mode:'fault',faultIndex:ix,difficulty:diff});

  drawPose($('good'),normal,{demoExercise:ex,width:960,height:540,angle:normAng,time:clockMs,
    label:'SYNTHETIC MOTION · STANDARD'});
  drawPose($('fault'),faulty,{demoExercise:ex,width:960,height:540,angle:faultAng,time:clockMs,
    label:'SYNTHETIC MOTION · INTENTIONAL FAULT'});

  $('goodArm').textContent=`${normAng.toFixed(1)}°`;
  $('badArm').textContent=`${faultAng.toFixed(1)}°`;
  const legRatio=getLegSpreadRatio(normal);
  $('goodLeg').textContent=legRatio!==null?`${legRatio.toFixed(2)}×`:`${normAngleObj?.side||'--'}`;
  $('badLeg').textContent=faultAngleObj?.side||'--';

  const alarm=checkPostureFault(faulty,ex,'左侧');
  $('alarm').textContent=alarm?.code||'—';

  const faultList=FAULTS[ex]||FAULTS.jumping_jack;
  $('faultName').textContent=`! 错误 0${ix+1} · ${faultList[ix]||'常见错误'}`;
  $('scrub').value=clockMs;
  $('clock').textContent=`${(clockMs/1000).toFixed(2)} / 4.70s`;
}

function tick(now){if(playing)clockMs=(clockMs+Math.min(50,now-last))%4700;last=now;render();requestAnimationFrame(tick)}
$('exerciseSelect').onchange=()=>{updateVariants();clockMs=0;render();};
$('variant').onchange=()=>{clockMs=0;render()};
$('difficulty').onchange=()=>{clockMs=0;render()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ 暂停':'▶ 播放'};
$('reset').onclick=()=>{clockMs=0;render()};
$('scrub').oninput=()=>{clockMs=Number($('scrub').value);playing=false;$('play').textContent='▶ 播放';render()};

updateVariants();
requestAnimationFrame(tick);
</script>
</body>
</html>
